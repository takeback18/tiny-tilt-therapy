name = "tiny-tilt-store"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
SITE_URL = "https://tinytilttherapy.com"
API_URL = "https://api.tinytilttherapy.com"

[[d1_databases]]
binding = "DB"
database_name = "tiny-tilt-store"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PDFS"
bucket_name = "tiny-tilt-pdfs"

# Custom domain: Cloudflare creates the DNS record and HTTPS certificate for
# api.tinytilttherapy.com automatically on deploy.
[[routes]]
pattern = "api.tinytilttherapy.com"
custom_domain = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
